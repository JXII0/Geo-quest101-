<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مراجعة الجيولوجيا - الحادي عشر علمي</title>
<style>
:root{--bg:#f7f2e8;--card:#fffdf8;--ink:#23302f;--teal:#0f7b78;--teal2:#d9efec;--amber:#c9821b;--red:#b3402f;--green:#2c7a45;--line:#e4dccb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic","Tajawal","Segoe UI",Tahoma,sans-serif;line-height:1.8;font-size:17px}
header{background:var(--teal);color:#fff;padding:18px 16px 10px}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 8px;opacity:.9;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tab{border:0;background:rgba(255,255,255,.18);color:#fff;padding:8px 14px;border-radius:20px;font:inherit;font-size:15px;cursor:pointer}
.tab.on{background:#fff;color:var(--teal);font-weight:700}
main{max-width:860px;margin:0 auto;padding:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1px solid var(--teal);background:#fff;color:var(--teal);padding:4px 11px;border-radius:16px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--teal);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{margin:0 0 6px;font-size:18px;color:var(--teal)}
.tag{display:inline-block;background:var(--teal2);color:var(--teal);border-radius:10px;padding:0 9px;font-size:12px;margin-left:6px}
ul{margin:6px 0;padding-right:20px}
li{margin:3px 0}
.opt{display:block;width:100%;text-align:right;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--teal)}
.opt.ok{background:#e1f3e6;border-color:var(--green)}
.opt.bad{background:#f8e0dc;border-color:var(--red)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:8px 16px;font:inherit;cursor:pointer;margin:4px 0 0 6px}
.btn.sec{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.ans{background:#e1f3e6;border-right:4px solid var(--green);padding:8px 12px;border-radius:8px;margin-top:8px;display:none}
.score{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:3;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.flip{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;cursor:pointer;padding:20px;border-radius:16px;background:var(--card);border:2px solid var(--teal)}
.flip.back{background:var(--teal2)}
.star{color:var(--amber)}
.mn{border-right:4px solid var(--amber)}
.hook{font-weight:700;font-size:18px;color:#7a4a05;background:#fff3d9;border-radius:8px;padding:6px 10px;display:block;margin:6px 0}
.chain{background:#eef7f6;border-radius:10px;padding:10px 12px;margin-top:10px}
.rel{display:flex;gap:8px;align-items:center;margin:6px 0;padding:6px 8px;background:#fff;border-radius:8px;border:1px solid var(--line)}
.rel b.up{color:var(--green)}.rel b.dn{color:var(--red)}
.note{font-size:13px;color:#6b6252}
details{margin:8px 0}summary{cursor:pointer;font-weight:700;color:var(--teal)}
.hide{display:none}
</style>
</head>

<script>
const DATA={"CH": [{"id": "u1c1", "unit": "الوحدة الأولى", "title": "مقدمة في علم الجيولوجيا", "lessons": "الدرس ١"}, {"id": "u1c2", "unit": "الوحدة الأولى", "title": "نشأة المجموعة الشمسية والأرض", "lessons": "الدرس ٢"}, {"id": "u2c1", "unit": "الوحدة الثانية", "title": "المعادن", "lessons": "الدروس ٣ إلى ٦"}, {"id": "u3c1", "unit": "الوحدة الثالثة", "title": "الصخور النارية", "lessons": "الدرسان ٧ و ٨"}, {"id": "u3c2", "unit": "الوحدة الثالثة", "title": "الصخور الرسوبية", "lessons": "الدروس ٩ إلى ١١"}, {"id": "u3c3", "unit": "الوحدة الثالثة", "title": "الصخور المتحولة", "lessons": "الدرسان ١٢ و ١٣"}, {"id": "u4c1", "unit": "الوحدة الرابعة", "title": "التحرك الكتلي", "lessons": "الدرس ١٤"}], "C": {"u1c1": {"review": ["كلمة جيولوجيا من مقطعين لاتينيين: Geo أي الأرض، و logy أي علم. يعني علم الأرض.", "علم الأرض يدرس نشأة الأرض وعلاقتها بالأجرام السماوية وتركيبها وأحداثها، والعوامل الداخلية والخارجية اللي لسه بتأثر فيها.", "الجيولوجيا مجالين: الفيزيائية (المواد المكونة للأرض والعمليات تحت السطح أو عليه) والتاريخية (ترتيب زمني للتغيرات الفيزيائية والبيولوجية في الماضي).", "منطقيا ندرس الجيولوجيا الفيزيائية قبل تاريخ الأرض، لأننا لازم نفهم العمليات الحالية الأول عشان نفسر الماضي.", "مبدأ الوتيرة الواحدة (الانتظام المستديم) لجيمس هاتون: الحاضر مفتاح الماضي. القوانين الفيزيائية والكيميائية والبيولوجية الحالية هي نفسها في الماضي.", "نظرية الكوارث تقول إن المواقع الطبيعية للأرض اتكونت بعد كوارث هائلة، وهي عكس فكرة الانتظام.", "الأرض في تغير دائم: تغيرات سريعة (زلازل، براكين، انزلاقات أرضية) وتغيرات بطيئة جدا غير ملحوظة.", "أول محاولة لتحديد عمر الأرض كانت سنة 1905 بالطريقة الإشعاعية."], "core": ["جيولوجيا = Geo (الأرض) + logy (علم).", "مجالان: الفيزيائية والتاريخية.", "هاتون = الوتيرة الواحدة = الحاضر مفتاح الماضي.", "نظرية الكوارث ضد الانتظام المستديم.", "عمر الأرض: أول محاولة 1905 بالطريقة الإشعاعية.", "علم الأرض مرتبط بعلم الفلك."], "mn": [["الفيزيائية ولا التاريخية؟", "فيزيائية = \"إيه بيحصل دلوقتي\"، تاريخية = \"إيه اللي حصل زمان بالترتيب\"", "الفيزيائية بتدرس المواد والعمليات الحالية. التاريخية بتحط ترتيب زمني للماضي. والحاضر هو اللي بيفتح لنا الماضي."], ["هاتون", "هاتون = \"الحاضر يفتح الماضي\"", "حرف ال \"ح\" في الحاضر و\"ه\" في هاتون. افتكر إن مفتاح الماضي هو الحاضر وليس العكس."]], "cards": [["أقسام الجيولوجيا الأساسية؟", "الجيولوجيا الفيزيائية والجيولوجيا التاريخية."], ["مفهوم يقول إن الحاضر مفتاح الماضي؟", "مبدأ الوتيرة الواحدة (الانتظام المستديم) لجيمس هاتون."], ["طريقة تحديد عمر الأرض؟", "الطريقة الإشعاعية (أول محاولة 1905)."], ["تغيرات سريعة تؤثر على سطح الأرض؟", "الزلازل والبراكين والانزلاقات الأرضية."], ["هل يرتبط علم الأرض بعلم الفلك؟", "نعم، مرتبط."]], "chain": "فهم الماضي ← نفهم العمليات الحالية (فيزيائية) ← الحاضر مفتاح الماضي (هاتون) ← نرتب الأحداث زمنيا (تاريخية) ← نحدد العمر بالطريقة الإشعاعية"}, "u1c2": {"review": ["نظرية سحابة الغبار (السديمية): المجموعة الشمسية اتكونت من سحابة ضخمة من الغبار والغازات في ذراع مجرة درب التبانة.", "ضغط أشعة النجوم حوالين السحابة خلّى مكوناتها تتحرك ببطء في اتجاه واحد. بعدين اتكونت دوامات صغيرة، وكل دوامة انكمشت وبقت نواة كوكب.", "الأرض في أول تكونها كانت حارة جدا وفي حالة سائلة (منصهرة).", "أسباب الحرارة: تساقط أجسام صغيرة من السحابة، تحلل العناصر المشعة، احتكاك مواد الأرض ببعضها، وتكون الأكاسيد والتفاعلات الكيميائية.", "التمايز: انقسام الأرض إلى أغلفة حسب الكثافة. المواد الأخف صعدت وكونت القشرة (غنية بالسيليكا والألمنيوم والصوديوم والبوتاسيوم). الأثقل زي الحديد غاص وكوّن اللب.", "كثافة المواد بتزيد كل ما نروح ناحية مركز الأرض.", "أول غلاف اتكون هو الغلاف الغازي: بخار ماء وCO2 وميثان (من تصدعات القشرة والبراكين). الأكسجين مش منهم.", "مياه الأمطار اتجمعت في المنخفضات وكونت المحيطات (عذبة في الأول)، وبعدين زادت ملوحتها لأن الماء الجاري أذاب الأملاح والمعادن.", "أول الكائنات الحية: البكتيريا الخضراء المزرقة، وهي اللي زودت الأرض بالأكسجين (بناء ضوئي)."], "core": ["نظرية سحابة الغبار: سحابة ← دوامات ← نوى كواكب.", "الأرض بدأت حارة جدا وسائلة.", "عوامل الحرارة الأربعة: سقوط، إشعاع، احتكاك، أكسدة.", "التمايز = تقسيم حسب الكثافة. الأخف قشرة، الأثقل لب.", "الغلاف الأول: الغازي. الأكسجين من البناء الضوئي مش من البراكين.", "أول حياة: بكتيريا خضراء مزرقة. وبعدها الأكسجين."], "mn": [["عوامل حرارة الأرض الأولى", "\"سقط، شع، حك، تأكسد\"", "سقط = تساقط الأجسام، شع = التحلل الإشعاعي، حك = الاحتكاك، تأكسد = الأكاسيد والتفاعلات الكيميائية."], ["التمايز", "\"الخفيف يطفو والتقيل يغوص\"", "خفيف: سيليكا + ألمنيوم + صوديوم + بوتاسيوم = قشرة. تقيل: حديد = لب."], ["الغازات الأولى", "\"بخار ميثان ثاني\"", "بخار الماء + الميثان + ثاني أكسيد الكربون. الأكسجين الدخيل الوحيد: جاي بعدين من البكتيريا."]], "cards": [["تحول الأرض إلى أغلفة حسب الكثافة؟", "التمايز."], ["الغازات في الغلاف الغازي الأولي؟", "بخار الماء وثاني أكسيد الكربون والميثان."], ["أول الكائنات الحية؟", "البكتيريا الخضراء المزرقة."], ["غاز لا ينتج من البراكين وتصدعات القشرة؟", "الأكسجين (ينتج من البناء الضوئي)."], ["لماذا زادت ملوحة المحيطات؟", "لأن الماء الجاري أذاب الأملاح والمعادن من قشرة الأرض."]], "chain": "سحابة غبار ← دوامات ← نوى كواكب ← أرض حارة سائلة ← تمايز بالكثافة ← غلاف غازي ← أمطار ومحيطات ← بكتيريا ← أكسجين"}, "u2c1": {"review": ["المعدن: مادة صلبة متجانسة طبيعية غير عضوية، لها تركيب كيميائي محدد ونظام بلوري مميز.", "مش معادن: السكر، النفط، الكهرمان (أصل عضوي)، الألماس الصناعي (مش طبيعي)، والبَرَد (بيذوب ويتحول سائل). الثلج المتساقط معدن.", "أشباه المعادن (زي الأوبال): تفتقر لتركيب كيميائي محدد أو شكل بلوري أو الاتنين.", "الخواص الفيزيائية: اللون، المخدش (لون المسحوق على الخزف غير المصقول)، البريق، الشفافية، التضوء، الصلادة، المتانة، الانفصام، المكسر، الوزن النوعي.", "الخواص التماسكية: الصلادة والمتانة والانفصام والمكسر. المخدش مش منها.", "الصلادة تتحدد بمقياس موهس: عشرة معادن من الأقل للأعلى. الكالسيت = 3، والتلك أقل المعادن صلادة.", "البلورة: جسم صلب متبلور متجانس يحده أسطح ملساء مستوية. المادة المتبلرة لها ترتيب هندسي منتظم للذرات.", "عناصر البلورة: أوجه، أحرف، زوايا مجسمة، زاوية بين وجهية. التماثل: محاور (ثنائي، ثلاثي، رباعي، سداسي)، مستويات، ومركز."], "core": ["٥ شروط للمعدن: طبيعي، صلب، متجانس، غير عضوي، تركيب كيميائي محدد.", "مقياس موهس: تلك 1 ... ألماس 10. كالسيت 3. التلك الأقل.", "المخدش = لون المسحوق (مش خاصية تماسكية).", "تضوء الكالسيت أحمر. الويليميت أخضر ساطع.", "المكسر: كوارتز محاري، أسبستوس ليفي، بيريت غير مستوي.", "محور ثلاثي = تكرار كل 120 درجة. ثنائي: مرتين. رباعي: أربع. سداسي: ست.", "عدد أنماط الوحدات البنائية: 14.", "الروابط الأيونية = هشة. الروابط الفلزية = قابلة للطرق."], "mn": [["ترتيب موهس (10 معادن)", "\"تعال جارنا كل فاكهة أطيب فاكهة كل تفاحة كبيرة أحمر\"", "تلك، جبس، كالسيت، فلوريت، أباتيت، فلسبار (أورثوكلاز)، كوارتز، توباز، كوراندوم، ألماس. أول حرف من كل كلمة هو أول حرف من اسم المعدن بالترتيب. (الترتيب القياسي لمقياس موهس.)"], ["الروائح والملمس", "\"ثوم أرسين، كبريت بيريت، دهني جرافيت\"", "الأرسينوبيريت = رائحة الثوم. البيريت = رائحة الكبريت. الجرافيت = ملمس دهني."], ["خواص خاصة", "\"كالسيت يشوف مرتين، كوارتز يكهرب، ماجنتيت يجذب\"", "الكالسيت = انكسار مزدوج. الكوارتز = شحنات كهربية عند الضغط. الماجنتيت = ينجذب للمغناطيس."], ["أنواع البريق", "\"فلزي، شبه فلزي، زجاجي، حريري، لؤلؤي، ترابي، صمغي\"", "الهيماتيت شبه فلزي. الجبس الليفي حريري. الكاولينيت ترابي."]], "cards": [["أقل المعادن صلادة؟", "التلك (1 على مقياس موهس)."], ["صلادة الكالسيت؟", "3 على مقياس موهس."], ["لون المسحوق الناتج عن حك المعدن على الخزف؟", "المخدش."], ["معدن يتضوء بالأخضر الساطع؟", "الويليميت."], ["معدن ذو ملمس دهني؟", "الجرافيت."], ["معدن يسبب رائحة الثوم؟", "الأرسينوبيريت."], ["معدن يؤثر عليه المغناطيس؟", "الماجنتيت."], ["معدن مكسره محاري؟", "الكوارتز."], ["معدن مكسره ليفي؟", "الأسبستوس."], ["محور تماثل تتكرر حوله الأوضاع كل 120 درجة؟", "المحور الثلاثي."], ["عدد أنماط الوحدات البنائية؟", "أربعة عشر."]], "chain": "طبيعي + صلب + غير عضوي + تركيب محدد = معدن ← خواصه: لون، مخدش، بريق، شفافية، تضوء ← التماسك: صلادة (موهس)، متانة، انفصام، مكسر ← الروابط: أيونية هشة، فلزية قابلة للطرق ← البلورة: أوجه، أحرف، زوايا ← تماثل: محاور، مستويات، مركز"}, "u3c1": {"review": ["الصخور النارية تتكون لما الصهارة (المادة الأم) تبرد وتتصلب.", "الصهارة اللي تطلع على سطح الأرض اسمها لافا (حمم بركانية). صخورها بركانية (لاطفحية). الصخور اللي بتتصلب تحت السطح جوفية (متداخلة).", "الصخور المتداخلة ما بتظهرش على السطح مباشرة لأنها اتكونت بعيد، ومحتاجة تعرية للصخور اللي فوقها.", "النسيج هو الشكل العام للصخر: حجم وشكل وترتيب البلورات.", "التبريد البطيء: بلورات قليلة وكبيرة (نسيج خشن). التبريد السريع: بلورات كثيرة وصغيرة (دقيق التبلور).", "النسيج الزجاجي (الأوبسيديان): تبريد سريع جدا. النسيج الفقاعي (الإسفنجي): فجوات من فقاعات الغاز. النسيج البورفيري: بلورات كبيرة بارزة داخل كتلة سفلية صغيرة. شعر بيلي: خيوط زجاج بركاني من قذف اللافا البازلتية.", "التركيب: فوق مافية (أقل من 45% سيليكا، بريدوتيت)، مافية بازلتية (غنية بالحديد والماغنسيوم)، وسطية (أنديزيت)، جرانيتية فاتحة (أكثر من 70% سيليكا).", "سلسلة باون: متواصلة (بلاجيوكليز، الكالسيوم أولا ثم الصوديوم) وغير متواصلة (أوليفين أولا، وآخرها البيوتيت قبل الكوارتز).", "البيريدوتيت هو المكون الأساسي للوشاح العلوي."], "core": ["ماجما تحت السطح = جوفي. لافا على السطح = بركاني.", "بطيء = بلورات كبيرة قليلة. سريع = صغيرة كثيرة.", "زجاجي = تبريد سريع جدا (أوبسيديان). فقاعي = غاز. بورفيري = كبيرة وصغيرة.", "مافي = حديد + ماغنسيوم، داكن وتقيل. فاتح = سيليكا + بوتاسيوم + صوديوم.", "أول في المتواصلة: كالسيوم. آخر: صوديوم.", "أول في غير المتواصلة: أوليفين.", "بريدوتيت = وشاح علوي، بدون كوارتز."], "mn": [["تدرج اللون والمافية", "\"داكن = تقيل = حديد وماغنسيوم\"", "المافي: Ma + Fe (ماغنسيوم + حديد) داكن وكثافته عالية. الجرانيتي فاتح غني بالسيليكا."], ["التبريد والنسيج", "\"بطيء كبير، سريع صغير\"", "كل ما التبريد أبطأ، البلورات أكبر وأقل عددا."], ["جوفي ولا بركاني؟", "\"تحت = جوفي، فوق = بركاني\"", "الجوفي بيتبلور تحت السطح وبطيء. البركاني على السطح وسريع فالنسيج دقيق."]], "cards": [["المادة الأم للصخور النارية؟", "الصهارة (الماجما)."], ["اسم الصهارة لما توصل لسطح الأرض؟", "اللافا (الحمم البركانية)."], ["نسيج البلورات الكبيرة البارزة داخل بلورات صغيرة؟", "النسيج البورفيري."], ["نسيج الأوبسيديان؟", "زجاجي، من تبريد سريع."], ["الصخور الغنية بالحديد والماغنسيوم؟", "المافية (البازلتية)."], ["المكون الأساسي للوشاح العلوي؟", "البيريدوتيت."], ["تسمية الإنديزيتية بالصخور الوسطية؟", "لأن لها صفات بين الجرانيتية والبازلتية."]], "chain": "صهارة ← تبريد ← بطيء (جوفي، خشن) أو سريع (بركاني، دقيق/زجاجي) ← غاز = فقاعي ← تركيب: فوق مافي ← مافي ← وسطي ← جرانيتي ← سلسلة باون (متواصلة وغير متواصلة)"}, "u3c2": {"review": ["الصخور الرسوبية تبدأ بالتجوية، وبعدين التعرية والنقل ثم الترسيب (يحصل لما سرعة الناقل تقل).", "التحجر: تحول الرواسب تدريجيا لصخر بالتراص والسمنتة.", "أنواع الرواسب: فتاتية (حبيبات من التجوية الميكانيكية والكيميائية، وتصنف حسب حجم الحبيبات)، كيميائية (ترسب أملاح ومواد ذائبة)، وعضوية.", "أصغر الحبيبات: الطين الصفحي. الحصى كبير الحجم ما بيوجدش في الكثبان الرملية لأن نقله يحتاج طاقة أكبر.", "الصخور الكيميائية: الحجر الجيري (كربونات الكالسيوم)، البطروخي (حول نواة)، والمتبخرات (ملح صخري، جبس، أنهيدريت). الفلنت والشيرت من السيليكا غير المتبلرة.", "العضوية: الطباشير والكوكينا. الفوسفات من هياكل وعظام الفقاريات.", "الجبس أقل صلادة من الأنهيدريت لأنه كبريتات كالسيوم مائية.", "التراكيب: الطبقة وسطحا التطبق، التطبق المتدرج (خشن عند القاعدة إلى دقيق)، المتقاطع، علامات النيم، الشقوق الطينية، الجيودات، العقيدات.", "طغيان البحر: ارتفاع الماء يغطي الشاطئ. انحسار البحر: تراجعه. التخطي: ترسب الرواسب البحرية الجديدة فوق الشاطئية.", "الرواسب الطمية تدل على بيئة نهرية قارية. الكربوناتية تدل على بحر عميق."], "core": ["بداية الصخر الرسوبي = التجوية.", "ترسيب ← تحجر (تراص + سمنتة).", "الفتاتية تصنف بحجم الحبيبات. الطين أصغر شيء.", "متبخرات: ملح صخري، جبس، أنهيدريت.", "فوسفات من عظام الفقاريات. فلنت = سيليكا.", "تدرج: خشن للدقيق = متدرج. شرائح مائلة = متقاطع.", "علامات النيم = تموجات. جيود = تجويف فيه بلورات.", "طغيان: المساحة القارية تقل."], "mn": [["مراحل التكوين", "\"تجوية، تعرية، نقل، ترسيب، تحجر\"", "ت ت ن ت ت. كل مرحلة بتسلم للي بعدها. التحجر هو التراص + السمنتة."], ["الثلاثة أنواع", "\"فتاتي، كيميائي، عضوي\"", "فتاتي = حبيبات. كيميائي = أملاح ذائبة. عضوي = كائنات."], ["طغيان وانحسار", "\"الطغيان يطغى على اليابسة\"", "طغيان = البحر يتقدم فالقارة تقل. انحسار = البحر يتراجع."]], "cards": [["تحول الرواسب لصخر رسوبي؟", "التحجر (بالتراص والسمنتة)."], ["سمك صخري متجانس بسطحين متوازيين؟", "الطبقة."], ["التطبق الخشن عند القاعدة والدقيق للأعلى؟", "التطبق المتدرج."], ["تموجات صغيرة على أسطح الطبقات؟", "علامات النيم."], ["تجاويف صخرية فيها بلورات معدنية؟", "الجيودات."], ["صخر ناتج عن تراكم عظام الفقاريات؟", "صخر الفوسفات."], ["ارتفاع مستوى البحر ليغطي الشاطئ؟", "طغيان البحر."], ["لماذا الجبس أقل صلادة من الأنهيدريت؟", "لأنه يحتوي على الماء (كبريتات كالسيوم مائية)."]], "chain": "تجوية ← تعرية ← نقل ← ترسيب (سرعة تقل) ← تحجر ← صخر رسوبي ← فتاتي أو كيميائي أو عضوي ← تراكيب: طبقات، تدرج، تقاطع، نيم ← بيئة ترسيب ← طغيان أو انحسار"}, "u3c3": {"review": ["التحول هو تغير نوع صخر إلى نوع آخر. الناتج تغير في النسيج والتركيب المعدني والكيميائي، حتى يوصل الصخر لتوازن مع الظروف الجديدة.", "عوامل التحول: الحرارة (أهمها، مصدر طاقة التفاعلات وإعادة التبلور)، الضغط، والمحاليل الحارة النشطة.", "حرارة الأرض الداخلية من التحلل الإشعاعي والطاقة الحرارية المخزنة.", "الضغط المحيط: متساوي من كل الاتجاهات فيقلل الحجم. الضغط الموجه (الإجهاد التفاضلي): غير متساو فيشوه الصخر. الصخور تنكمش باتجاه الإجهاد وتزيد في الطول بالاتجاه المتعامد عليه.", "أنواع التحول: تلامسي (حراري) حول جسم ناري منصهر وله هالة تحول، إقليمي مصاحب لحركات القشرة وبناء الجبال، دفني للطبقات العميقة، وبالمحاليل الحارة.", "حجم هالة التحول يتوقف على كتلة الجسم الناري وحرارته والتركيب المعدني للصخر.", "الأنسجة المتورقة: الإردوازي (انشقاق على أسطح متقاربة)، الشيستوزي (معادن صفائحية)، النيسوزي (أحزمة داكنة وفاتحة). غير المتورقة: حبيبي مثل الرخام والكوارتزيت.", "الرخام من الحجر الجيري (تاسوس في الحرم المكي). الهورنفلس من الطين الصفحي (الطفل) حراريا."], "core": ["الحرارة أهم عامل. الضغط المحيط يقلل الحجم. الموجه يشوه.", "تلامسي = حرارة حول جسم ناري = هالة تحول.", "إقليمي = بناء الجبال والقارات.", "الإردواز = انشقاق. الشيست = صفائحي. النيس = أحزمة.", "رخام وكوارتزيت = حبيبي غير متورق.", "هورنفلس = طفل + حرارة.", "الجارنت = معدن حرارة عالية قرب الجسم الصهاري."], "mn": [["درجة التحول للمتورق (الاتجاه العام)", "\"إردواز، فيليت، شيست، نيس\"", "يزيد التحول من الإردواز إلى الفيليت ثم الشيست ثم النيس (تسلسل شائع في الكتب). النيس فيه أحزمة ملونة."], : "لأن فرص تكون المادة المترسبة نفسها من جديد تكون ضئيلة", "lesson": 10}, {"ch": "u3c2", "t": "open", "k": "علل", "q": "علل: وجود الطبقات الرقيقة في التطبق المتقاطع بشكل مائل عن مستوى التطبق.", "a": "نتيجة تغيير في اتجاه التيار", "lesson": 10}, {"ch": "u3c3", "t": "open", "k": "علل", "q": "علل: يتميز الإردواز بخاصية الانشقاق الصخري أو الإردوازي.", "a": "بسبب وجود الأسطح المتقاربة جدا والتي ينشق الصخر على طولها عند طرقه بمطرقة إلى صفائح", "lesson": 13}, {"ch": "u3c3", "t": "open", "k": "علل", "q": "علل: يتميز الرخام الأبيض في الحرم المكي (التاسوس )بدرجة حرارته المعتدلة طولا اليوم", "a": "لأنه يمتص الرطوبة في الليل عبر مسام دقيقة ويخرجها في النهار", "lesson": 13}, {"ch": "u3c3", "t": "open", "k": "علل", "q": "علل: يتزامن التحول بالمحاليل الحارة مع التحول التلامسي.", "a": "لأن وجود الأجسام النارية يوفر الحرارة الضرورية لدورة المحاليل الغنية بالأيونات لتغير التركيب الكيميائي", "lesson": 13}, {"ch": "u4c1", "t": "open", "k": "علل", "q": "علل: تتحرك الإنهيارات الأرضية (الصخرية )بسرعة كبيرة.", "a": "عندما يكون المنحدر شديد الإنحدار فإن الإنهيارات الصخرية تندفع إلى أسفل بسرعة كبيرة.", "lesson": 14}, {"ch": "u4c1", "t": "open", "k": "علل", "q": "علل: ت سرع الحرائق من عملية التحرك الكتلي.", "a": "لأن الطبقة العليا تتفكك وتجف نتيجة الحرائق والطقس الجاف وبالتالي تميل الكتل إلى ،الإنزلاق ويمكن أن تشكل الحرائق طبقة غير منفذة للماء مما يزيد كمية المياه الجاريه فيتولد سيال من الطين اللزج والركام الصخري.", "lesson": 14}, {"ch": "u4c1", "t": "open", "k": "علل", "q": "علل: تؤدي إزالة النباتات إلى التحرك الكتلي.", "a": "لأن النبات يساعد في مقاومة،التعرية وفي إستقرار،المنحدر فالجذور تربط حبيبات التربة والطبقة السطحية المفككة ببعضها،البعض وبالتالي إزالة النبات يؤدي إلى التحرك الكتلي وخاصة إذا كان المنحدر شديد.", "lesson": 14}, {"ch": "u4c1", "t": "open", "k": "علل", "q": "علل: تعتبر الزلازل من أهم المحفزات لعمليات التحرك الكتلي.", "a": "لأن الزلازل يتبعها إرتدادات مباشرة تسمح بخلخلة كميات ضخمة من الصخور والمواد غير المتماسكة وتسمح بإقتلاعها.", "lesson": 14}, {"ch": "u4c1", "t": "open", "   h+=`<div class="card"><h3>${c.title} <span class="tag">${c.lessons}</span></h3><ul>${d.review.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="chain"><b>سلسلة الربط:</b> ${esc(d.chain)}</div></div>`});
 $('#view').innerHTML=h;
}
/* quiz */
let qs=[],qi=0,sc={r:0,w:0},answered=false;
function rQuiz(){
 const modes=[['mcq','اختيار من متعدد وصح/خطأ'],['open','أسئلة مفتوحة (مصطلح، علل، أكمل)']];
 const kinds=['الكل','مصطلح','علل','أكمل','الدخيل','متنوع'];
 let h=`<div class="chips">${modes.map(m=>`<button class="chip ${qmode===m[0]?'on':''}" onclick="qmode='${m[0]}';rQuiz();">${m[1]}</button>`).join('')}</div>`;
 if(qmode==='open')h+=`<div class="chips">${kinds.map(k=>`<button class="chip ${(window.okind||'الكل')===k?'on':''}" onclick="window.okind='${k}';rQuiz();">${k}</button>`).join('')}</div>`;
 h+=`<div class="score"><span id="sc"></span><button class="btn sec" onclick="startQuiz()">إعادة وخلط</button></div><div id="q"></div>`;
 $('#view').innerHTML=h;startQuiz(true);
}
function startQuiz(keep){
 sc={r:0,w:0};qi=0;answered=false;
 const k=window.okind||'الكل';
 qs=shuffle(D.filter(x=>inCh(x)&&(qmode==='mcq'?(x.t==='mcq'||x.t==='tf'):(x.t==='open'&&(k==='الكل'||x.k===k)))));
 if(!keep){buildChips();const sw=document.querySelectorAll('.chips');}
 if(!$('#q')){rQuiz();return}
 showQ();
}
function updSc(){const e=$('#sc');if(e)e.textContent=`السؤال ${Math.min(qi+1,qs.length)} من ${qs.length}  |  صح: ${sc.r}  خطأ: ${sc.w}`}
function showQ(){
 const el=$('#q');updSc();
 if(!qs.length){el.innerHTML='<div class="card">مفيش أسئلة هنا لهذا الدرس. جربي درس تاني.</div>';return}
 if(qi>=qs.length){el.innerHTML=`<div class="card"><h3>خلصتي!</h3>النتيجة: ${sc.r} صح و ${sc.w} خطأ.<br><button class="btn" onclick="startQuiz()">ابدأي من جديد</button></div>`;return}
 const x=qs[qi];answered=false;let h=`<div class="card"><span class="tag">${chTitle(x.ch)}</span>`;
 if(x.t==='mcq'){h+=`<p>${esc(x.q)}</p>`+shuffle(x.o.map((o,i)=>[o,i])).map(([o,i])=>`<button class="opt" data-ok="${o[1]?1:0}" onclick="pick(this)">${esc(o[0])}</button>`).join('')}
 else if(x.t==='tf'){h+=`<p><b>صح أم خطأ؟</b><br>${esc(x.q)}</p><button class="opt" data-ok="${x.a?1:0}" onclick="pick(this)">صح</button><button class="opt" data-ok="${x.a?0:1}" onclick="pick(this)">خطأ</button>`}
 else{h+=`<span class="tag">${x.k}</span><p>${esc(x.q)}</p><button class="btn sec" onclick="document.getElementById('an').style.display='block'">إظهار الإجابة</button><div class="ans" id="an">${esc(x.a)}</div><div style="margin-top:8px"><button class="btn" onclick="self1(1)">عرفتها</button><button class="btn sec" onclick="self1(0)">محتاجة مراجعة</button></div>`}
 h+=`<div id="nx" class="hide"><button class="btn" onclick="qi++;showQ()">التالي</button></div></div>`;
 el.innerHTML=h;
}
function pick(b){if(answered)return;answered=true;const ok=b.dataset.ok==='1';b.classList.add(ok?'ok':'bad');if(!ok)document.querySelectorAll('.opt').forEach(o=>{if(o.dataset.ok==='1')o.classList.add('ok')});ok?sc.r++:sc.w++;updSc();$('#nx').classList.remove('hide')}
function self1(ok){if(answered)return;answered=true;ok?sc.r++:sc.w++;document.getElementById('an').style.display='block';updSc();$('#nx').classList.remove('hide')}
/* flashcards */
let fcs=[],fi=0,fb=false;
function rFc(){
 fcs=[];CH.filter(inCh).forEach(c=>C[c.id].cards.forEach(p=>fcs.push({f:p[0],b:p[1],ch:c.id})));
 GL.filter(inCh).forEach(g=>fcs.push({f:'ما معنى: '+g.t+'؟',b:g.d,ch:g.ch}));
 fcs=shuffle(fcs);fi=0;fb=false;showFc();
}
function showFc(){
 if(!fcs.length){$('#view').innerHTML='<div class="card">مفيش كروت.</div>';return}
 const x=fcs[fi];
 $('#view').innerHTML=`<div class="score"><span>كارت ${fi+1} من ${fcs.length}</span><button class="btn sec" onclick="rFc()">خلط</button></div><div class="flip ${fb?'back':''}" onclick="fb=!fb;showFc()">${esc(fb?x.b:x.f)}</div><p class="note" style="text-align:center">اضغطي على الكارت عشان تقلبيه. ${esc(chTitle(x.ch))}</p><div style="text-align:center"><button class="btn sec" onclick="fi=(fi-1+fcs.length)%fcs.length;fb=false;showFc()">السابق</button><button class="btn" onclick="fi=(fi+1)%fcs.length;fb=false;showFc()">التالي</button></div>`;
}
function rCore(){
 let h='<div class="card">ليلة الامتحان: اقري ده بس. كل نقطة هنا لازم تبقى عارفاها.</div>';
 CH.filter(inCh).forEach(c=>{h+=`<div class="card"><h3>${c.title}</h3><ul>${C[c.id].core.map(x=>`<li><span class="star">★</span> ${esc(x)}</li>`).join('')}</ul></div>`});
 $('#view').innerHTML=h;
}
function rMem(){
 let h='';
 CH.filter(inCh).forEach(c=>{const d=C[c.id];
  h+=`<div class="card mn"><h3>${c.title}</h3>`+d.mn.map(m=>`<p><b>${esc(m[0])}</b><span class="hook">${esc(m[1])}</span>${esc(m[2])}</p>`).join('')+`<div class="chain"><b>تربيط النقط:</b> ${esc(d.chain)}</div></div>`});
 h+=`<div class="card"><h3>علاقات طردية وعكسية</h3><p class="note">طردية: واحد يزيد والتاني يزيد. عكسية: واحد يزيد والتاني يقل.</p>`+REL.map(r=>`<div class="rel"><b class="${r[0]==='طردية'?'up':'dn'}">${r[0]==='طردية'?'↑↑ طردية':'↑↓ عكسية'}</b><span><b>${esc(r[1])}</b><br><span class="note">${esc(r[2])}</span></span></div>`).join('')+`</div>`;
 $('#view').innerHTML=h;
}

function rEx(){
 $('#chips').innerHTML='';
 let h='<div class="card">ملاحظة: الامتحانات دي ورق أسئلة بس من غير إجابات. الإجابة مكتوبة بس لما أكون متأكدة منها من نموذج الإجابة. ',
 h2='<span class="tag">نموذج رسمي</span> = من نموذج الإجابة الرسمي. <span class="tag">من معلوماتي</span> = راجعيها في الكتاب. وإلا اقري الصفحة المكتوبة جنب السؤال.</div>';
 h+=h2;
 EX.forEach((e,ei)=>{h+=`<h3 style="color:var(--teal)">${e.name}</h3>`;let last='';
  e.items.forEach((x,i)=>{if(x.sec!==last){h+=`<p><b>${x.sec}</b></p>`;last=x.sec}
   const lab=x.src==='key'?'نموذج رسمي':x.src==='gen'?'من معلوماتي، راجعيها':x.src==='ref'?'':'';
   h+=`<div class="card"><p>${esc(x.q)} <span class="tag">${x.ref||''}</span></p>`+(x.a?`<button class="btn sec" onclick="this.nextElementSibling.style.display='block'">إظهار الإجابة</button><div class="ans">${esc(x.a)} ${lab?`<span class="tag">${lab}</span>`:''}</div>`:`<p class="note">الإجابة في الكتاب ${x.ref||''}</p>`)+`</div>`})});
 $('#view').innerHTML=h;
}
render();
</script>
